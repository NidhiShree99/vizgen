name: Keep database awake

# Supabase's free tier pauses a project after ~7 days without
# activity. A trivial query a couple of times a week counts as
# activity, so the live app never wakes up to a dead database.
on:
  schedule:
    - cron: "0 14 * * 1,4"   # Mondays and Thursdays, 14:00 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary==2.9.12
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          import psycopg2

          url = os.environ.get("DATABASE_URL")
          if not url:
              sys.exit("DATABASE_URL secret is not set on this repo")

          conn = psycopg2.connect(url, connect_timeout=30)
          cur = conn.cursor()
          cur.execute("SELECT 1")
          print("database reachable:", cur.fetchone())
          conn.close()
          PY
